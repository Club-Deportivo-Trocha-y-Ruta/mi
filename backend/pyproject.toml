[project]
name = "trocha-y-ruta-backend"
version = "0.1.0"
description = "Backend monolito para Club Deportivo Trocha y Ruta — Fase 1"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.40",
    "sqlalchemy[asyncio]>=2.0",
    "aiomysql>=0.3",
    "alembic>=1.17",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyjwt>=2.12",
    "bcrypt>=4.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "gpxpy>=1.6",
    "defusedxml>=0.7",
    "markdown>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.mutmut]
source_paths = ["app/services"]
do_not_mutate = [
    "app/services/ai/*",
    "app/services/notification/*",
    "app/services/calendar/*",
    "app/services/training/*",
    # race subpackages (all excluded — complex AI/agentic code)
    "app/services/race/agents/*",
    "app/services/race/ai/*",
    "app/services/race/eval/*",
    "app/services/race/prompts/*",
    "app/services/race/rag/*",
    # race sibling modules (excluded — keep standings.py un-excluded for mutation)
    "app/services/race/__init__.py",
    "app/services/race/analytics.py",
    "app/services/race/analytics_charts.py",
    "app/services/race/calendar_sync.py",
    "app/services/race/club_insights.py",
    "app/services/race/competitor_linking.py",
    "app/services/race/csv_parser.py",
    "app/services/race/group_launch.py",
    "app/services/race/ingestor.py",
    "app/services/race/insights_history.py",
    "app/services/race/matcher.py",
    "app/services/race/normalizer.py",
    "app/services/race/pdf_parser.py",
    "app/services/race/queries.py",
    "app/services/race/results_read.py",
    "app/services/race/revision.py",
    "app/services/race/revision_diff_view.py",
    "app/services/race/roster.py",
    "app/services/race/run_staleness.py",
    "app/services/race/schemas.py",
    "app/services/race/season_panorama.py",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: integration tests que llaman APIs externas (Gemini real). Excluidos por default; correr con `-m integration`.",
    "golden: eval bloqueante del RaceAnalystAgent contra golden dataset. Requiere AI_API_KEY. Excluidos por default; correr con `-m golden`.",
]
