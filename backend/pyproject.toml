[project]
name = "trocha-y-ruta-backend"
version = "0.1.0"
description = "Backend monolito para Club Deportivo Trocha y Ruta — Fase 1"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.40",
    "sqlalchemy[asyncio]>=2.0",
    "aiomysql>=0.3",
    "alembic>=1.17",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyjwt>=2.12",
    "bcrypt>=4.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "gpxpy>=1.6",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
