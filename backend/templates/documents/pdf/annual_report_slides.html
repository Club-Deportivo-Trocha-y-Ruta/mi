<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Diapositivas — {{ athlete_full_name }}</title>
<style>
  @font-face { font-family: 'Inter Variable'; src: url('static/fonts/InterVariable.woff2'); }
  @font-face { font-family: 'Plus Jakarta Sans'; src: url('static/fonts/PlusJakartaSans-Variable.woff2'); }

  :root {
    --primary: #20b7c9;
    --primary-dark: #1a96a4;
    --primary-deep: #0f6f79;
    --accent: #8be000;
    --accent-dark: #6fb300;
    --accent-deep: #456f00;
    --charcoal: #2f2f2f;
    --text: #2f2f2f;
    --muted: #5a5a5a;
    --tint: #f7f8f8;
    --hairline: rgba(0, 0, 0, 0.1);
    --teal-tint: #effafb;
    --teal-soft: #f2fbfc;
    --lime-tint: #effbdb;
    --radius-card: 16pt;
    --radius-control: 12pt;
    --radius-pill: 999pt;
    --font-sans: 'Inter Variable', Arial, Helvetica, sans-serif;
    --font-display: 'Plus Jakarta Sans', Arial, Helvetica, sans-serif;
  }

  @page { size: 13.333in 7.5in; margin: 0; }
  * { box-sizing: border-box; }
  body { font-family: var(--font-sans); color: var(--text); margin: 0; }

  .slide {
    width: 13.333in; height: 7.5in;
    padding: 0.92in 0.8in 0.6in 0.8in;
    page-break-after: always; position: relative;
  }
  .slide:last-child { page-break-after: avoid; }
  .slide::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 6pt;
    background: linear-gradient(to right, var(--primary) 0%, var(--primary) 55%, var(--accent) 55%, var(--accent) 100%);
  }
  .brand-badge { position: absolute; top: 0.3in; left: 0.8in; }
  .brand-badge img { height: 30pt; width: auto; }
  .page-badge { position: absolute; top: 0.38in; right: 0.8in; font-family: var(--font-display); font-weight: 700; font-size: 9pt; color: var(--primary-deep); }

  .editorial-mark {
    background-image: linear-gradient(to top, rgba(139, 224, 0, 0.55) 0.34em, transparent 0.34em);
    background-repeat: no-repeat; background-size: 100% 100%;
    -webkit-box-decoration-break: clone; box-decoration-break: clone;
    padding: 0 0.08em; border-radius: 2pt;
  }

  /* Portadas */
  .slide-title { text-align: center; margin-top: 0.55in; }
  .slide-title .title-logo { height: 120pt; width: auto; margin-bottom: 14pt; }
  .slide-title .kicker {
    font-family: var(--font-sans); font-weight: 700; letter-spacing: 3pt; text-transform: uppercase;
    font-size: 12pt; color: var(--primary-deep); margin-bottom: 8pt;
  }
  .slide-title h1 { font-family: var(--font-display); font-size: 50pt; font-weight: 800; line-height: 1.12; color: var(--charcoal); margin: 0 0 14pt 0; }
  .slide-title .subtitle { font-size: 17pt; color: var(--muted); margin: 3pt 0; }
  .slide-title .subtitle.small { font-size: 13pt; }

  /* Contenido */
  .slide-content .eyebrow {
    font-size: 10pt; font-weight: 700; letter-spacing: 2pt; text-transform: uppercase;
    color: var(--primary-deep); margin: 0 0 4pt 0;
  }
  .slide-content h2 {
    font-family: var(--font-display); font-size: 30pt; font-weight: 800; line-height: 1.15;
    color: var(--charcoal); margin: 0 0 20pt 0;
  }
  .slide-content p { font-size: 15pt; line-height: 1.5; color: var(--muted); margin: 0 0 10pt 0; }
  .slide-content p.lead { font-size: 17pt; color: var(--text); }
  .slide-content p.example { font-size: 15pt; color: var(--text); }
  .slide-content strong { color: var(--charcoal); font-weight: 700; }
  .center-content { text-align: center; margin-top: 1.0in; }

  .big-list { list-style: none; padding: 0; margin: 0; }
  .big-list li { font-size: 21pt; line-height: 1.45; padding-left: 34pt; position: relative; margin-bottom: 22pt; color: var(--text); }
  .big-list li::before { content: "●"; color: var(--accent-dark); position: absolute; left: 0; font-size: 13pt; top: 7pt; }
  .slide-title { margin-top: 0.4in; }

  .stat-grid { display: flex; flex-wrap: wrap; gap: 18pt; justify-content: center; margin-top: 12pt; }
  .stat-tile {
    background: var(--teal-tint); border-radius: var(--radius-card);
    padding: 22pt 26pt; min-width: 200pt; text-align: center;
  }
  .stat-tile--accent { background: var(--lime-tint); }
  .stat-num { font-family: var(--font-display); font-size: 36pt; font-weight: 800; line-height: 1.05; color: var(--primary-deep); }
  .stat-tile--accent .stat-num { color: var(--accent-deep); }
  .stat-label { font-size: 12pt; color: var(--muted); margin-top: 5pt; line-height: 1.3; }

  .pill-row { display: flex; gap: 24pt; justify-content: center; margin: 20pt 0; }
  .pill { background: var(--charcoal); color: #fff; border-radius: var(--radius-pill); padding: 16pt 36pt; font-size: 15pt; text-align: center; line-height: 1.3; }
  .pill strong { display: block; font-family: var(--font-display); font-size: 22pt; color: var(--accent); }

  .formula-box {
    background: var(--teal-soft); border-left: 6pt solid var(--primary);
    border-radius: 0 var(--radius-control) var(--radius-control) 0;
    padding: 16pt 20pt; font-family: var(--font-display); font-size: 18pt; font-weight: 600;
    color: var(--charcoal); text-align: center; margin: 14pt 0;
  }
  .formula-box strong { color: var(--primary-deep); font-weight: 800; }

  table.slide-table { width: 100%; border-collapse: collapse; font-size: 13pt; margin-top: 8pt; }
  table.slide-table thead tr { background: var(--primary-deep); color: #fff; }
  table.slide-table th { padding: 8pt 10pt; text-align: left; font-family: var(--font-display); }
  table.slide-table td { padding: 7pt 10pt; border-bottom: 0.75pt solid var(--hairline); }
  table.slide-table tbody tr:nth-child(even) { background: var(--tint); }
  table.slide-table tr.hl td { background: var(--lime-tint); color: var(--accent-deep); font-weight: 700; }

  .highlight-card {
    background: var(--teal-soft); border-left: 8pt solid var(--accent);
    border-radius: 0 var(--radius-card) var(--radius-card) 0;
    padding: 24pt 30pt; text-align: center;
  }
  .highlight-title { font-size: 15pt; color: var(--muted); }
  .highlight-num { font-family: var(--font-display); font-size: 46pt; font-weight: 800; color: var(--primary-deep); margin: 6pt 0; line-height: 1.1; }
  .highlight-card p { font-size: 15pt; max-width: 600pt; margin: 8pt auto 0; color: var(--text); }

  .fact-grid { display: flex; flex-wrap: wrap; gap: 14pt 28pt; margin-top: 14pt; }
  .fact { flex: 1 1 42%; border-left: 3pt solid var(--primary); padding-left: 12pt; }
  .fact__label { display: block; font-size: 10pt; font-weight: 700; letter-spacing: 1.2pt; text-transform: uppercase; color: var(--muted); }
  .fact__value { display: block; margin-top: 3pt; font-size: 16pt; font-weight: 600; line-height: 1.35; color: var(--charcoal); }

  .sources { font-size: 9.5pt; color: var(--muted); margin-top: 14pt; }
</style>
</head>
<body>
{% for slide_html in slides %}
<div class="slide">
  <div class="brand-badge"><img src="static/img/logo.webp" alt="Club Deportivo Trocha y Ruta"></div>
  <div class="page-badge">{{ loop.index }} / {{ slides|length }}</div>
  {{ slide_html | safe }}
</div>
{% endfor %}
</body>
</html>
