<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Informe de temporada {{ season_year }} — {{ athlete_full_name }}</title>
<style>
  /* Fuentes de marca. Sin rango en font-weight: WeasyPrint lo rechaza y
     descarta la @font-face entera; con una sola declaración Pango sí aplica
     el eje variable al pedir 400/600/700/800. */
  @font-face { font-family: 'Inter Variable'; src: url('static/fonts/InterVariable.woff2'); }
  @font-face { font-family: 'Plus Jakarta Sans'; src: url('static/fonts/PlusJakartaSans-Variable.woff2'); }

  :root {
    --primary: #20b7c9;
    --primary-dark: #1a96a4;
    --primary-deep: #0f6f79;
    --accent: #8be000;
    --accent-dark: #6fb300;
    --accent-deep: #456f00;
    --charcoal: #2f2f2f;
    --text: #2f2f2f;
    --muted: #5a5a5a;
    --tint: #f7f8f8;
    --surface-muted: #d8d8d8;
    --hairline: rgba(0, 0, 0, 0.1);
    --teal-tint: #effafb;
    --teal-soft: #f2fbfc;
    --lime-tint: #effbdb;
    --radius-card: 12pt;
    --radius-control: 9pt;
    --radius-chip: 4.5pt;
    --radius-pill: 999pt;
    --font-sans: 'Inter Variable', Arial, Helvetica, sans-serif;
    --font-display: 'Plus Jakarta Sans', Arial, Helvetica, sans-serif;
  }

  @page {
    size: A4;
    margin: 24mm 17mm 22mm 17mm;
    @top-center { content: element(page_runner); }
    @bottom-left {
      content: "Documento confidencial — datos de menor de edad protegidos.";
      font-family: 'Inter Variable', Arial, sans-serif; font-size: 7.5pt; color: #5a5a5a;
    }
    @bottom-right {
      content: counter(page) " / " counter(pages);
      font-family: 'Plus Jakarta Sans', Arial, sans-serif; font-size: 8pt; font-weight: 700; color: #0f6f79;
    }
  }

  * { box-sizing: border-box; }
  body {
    font-family: var(--font-sans);
    font-size: 10pt;
    line-height: 1.5;
    color: var(--text);
    margin: 0;
    widows: 2; orphans: 2;
  }

  /* Cabecera corrida */
  .page-runner {
    position: running(page_runner);
    width: 100%;
    padding-bottom: 5pt;
    border-bottom: 1pt solid var(--hairline);
    font-family: var(--font-sans);
    font-size: 8pt;
    color: var(--muted);
  }
  .page-runner table { width: 100%; border-collapse: collapse; }
  .page-runner td { vertical-align: middle; padding: 0; }
  .page-runner img { height: 22pt; width: auto; vertical-align: middle; }
  .page-runner .runner-title { text-align: right; font-weight: 600; color: var(--primary-deep); }

  /* Portada compacta */
  .hero { margin: 0 0 16pt 0; padding-bottom: 12pt; border-bottom: 3pt solid var(--accent); }
  .hero table { border-collapse: collapse; width: 100%; }
  .hero td { vertical-align: middle; padding: 0; }
  .hero img { height: 68pt; width: auto; }
  .hero .hero-text { padding-left: 16pt; }
  .hero h1 {
    font-family: var(--font-display);
    font-size: 24pt; font-weight: 800; line-height: 1.15;
    color: var(--charcoal); margin: 3pt 0 6pt 0;
  }
  .hero .hero-sub { font-size: 10pt; color: var(--muted); margin: 0; }

  .eyebrow {
    font-family: var(--font-sans);
    font-size: 8pt; font-weight: 700; letter-spacing: 1.6pt; text-transform: uppercase;
    color: var(--primary-deep); margin: 0;
  }

  /* Trazo lima de resaltado (editorial-mark del sitio) */
  .editorial-mark {
    background-image: linear-gradient(to top, rgba(139, 224, 0, 0.55) 0.34em, transparent 0.34em);
    background-repeat: no-repeat;
    background-size: 100% 100%;
    -webkit-box-decoration-break: clone; box-decoration-break: clone;
    padding: 0 0.08em; border-radius: 1pt;
  }

  h2 {
    font-family: var(--font-display);
    font-size: 16pt; font-weight: 800; line-height: 1.2;
    color: var(--charcoal); margin: 18pt 0 8pt 0;
    page-break-after: avoid;
  }
  h3 {
    font-family: var(--font-display);
    font-size: 11.5pt; font-weight: 700; line-height: 1.3;
    color: var(--primary-deep); margin: 12pt 0 5pt 0;
    page-break-after: avoid;
  }
  p { margin: 0 0 7pt 0; }
  p.lead { font-size: 11.5pt; line-height: 1.5; color: var(--text); }
  p.note { font-size: 7.5pt; line-height: 1.4; color: var(--muted); }
  ul { margin: 4pt 0 8pt 0; padding-left: 0; list-style: none; }
  ul li { position: relative; padding-left: 14pt; margin-bottom: 4pt; }
  ul li::before { content: "●"; position: absolute; left: 0; top: 0; color: var(--accent-dark); font-size: 7pt; line-height: 1.9; }
  strong { font-weight: 700; color: var(--charcoal); }

  /* Cifras */
  .stat-strip { display: flex; flex-wrap: wrap; gap: 8pt; margin: 8pt 0 10pt 0; page-break-inside: avoid; }
  .stat {
    flex: 1 1 100pt; min-width: 100pt;
    background: var(--teal-tint); border-radius: var(--radius-control);
    padding: 10pt 8pt; text-align: center;
  }
  .stat--accent { background: var(--lime-tint); }
  .stat__value {
    display: block; font-family: var(--font-display); font-weight: 800;
    font-size: 22pt; line-height: 1.1; color: var(--primary-deep);
  }
  .stat--accent .stat__value { color: var(--accent-deep); }
  .stat__label { display: block; margin-top: 3pt; font-size: 8pt; line-height: 1.3; color: var(--muted); }

  .stat-callout {
    margin: 12pt 0; padding: 10pt 12pt; text-align: center;
    border-top: 2pt solid var(--accent); border-bottom: 2pt solid var(--accent);
    page-break-inside: avoid;
  }
  .stat-callout__value {
    display: block; font-family: var(--font-display); font-weight: 800;
    font-size: 30pt; line-height: 1.05; color: var(--primary-deep);
  }
  .stat-callout__text { display: block; margin: 4pt auto 0; max-width: 340pt; font-size: 9pt; line-height: 1.45; color: var(--muted); }

  .fact-grid { display: flex; flex-wrap: wrap; gap: 8pt 14pt; margin: 8pt 0 10pt 0; page-break-inside: avoid; }
  .fact { flex: 1 1 42%; min-width: 42%; border-left: 2pt solid var(--primary); padding-left: 8pt; }
  .fact__label { display: block; font-size: 7.5pt; font-weight: 700; letter-spacing: 0.8pt; text-transform: uppercase; color: var(--muted); }
  .fact__value { display: block; margin-top: 1.5pt; font-size: 9.5pt; font-weight: 600; line-height: 1.35; color: var(--charcoal); }

  .formula {
    background: var(--teal-soft); border-left: 3pt solid var(--primary);
    border-radius: 0 var(--radius-control) var(--radius-control) 0;
    padding: 8pt 12pt; margin: 8pt 0; text-align: center;
    font-family: var(--font-display); font-weight: 600; font-size: 10.5pt; color: var(--charcoal);
    page-break-inside: avoid;
  }
  .formula strong { color: var(--primary-deep); font-weight: 800; }

  .callout-box {
    background: var(--teal-soft); border: 1pt solid rgba(32, 183, 201, 0.25);
    border-radius: var(--radius-card); padding: 9pt 12pt; margin: 8pt 0 10pt 0;
    font-size: 9.5pt; page-break-inside: avoid;
  }
  .callout-box--accent { background: var(--lime-tint); border-color: rgba(139, 224, 0, 0.45); }

  .pull-quote {
    margin: 10pt 0; padding: 10pt 14pt;
    border-left: 4pt solid var(--primary); background: var(--teal-soft);
    border-radius: 0 var(--radius-control) var(--radius-control) 0;
    page-break-inside: avoid;
  }
  .pull-quote__text { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 13pt; line-height: 1.4; color: var(--charcoal); }
  .pull-quote__attribution { margin: 5pt 0 0; font-size: 8.5pt; color: var(--muted); }

  .pill-row { display: flex; gap: 10pt; justify-content: center; margin: 8pt 0 6pt 0; }
  .pill {
    background: var(--charcoal); color: #fff; border-radius: var(--radius-pill);
    padding: 7pt 18pt; font-size: 9pt; text-align: center; line-height: 1.3;
  }
  .pill strong { display: block; font-family: var(--font-display); font-size: 12pt; color: var(--accent); }

  /* Recorrido compacto */
  .race-list { margin: 6pt 0 8pt 0; }
  .race { display: flex; gap: 8pt; padding: 4pt 0; border-bottom: 0.5pt solid var(--hairline); page-break-inside: avoid; }
  .race__date {
    flex: 0 0 40pt; font-family: var(--font-display); font-weight: 700; font-size: 8.5pt;
    color: var(--primary-deep); padding-top: 1pt;
  }
  .race__body { flex: 1 1 auto; font-size: 9pt; line-height: 1.4; }
  .race--accent { background: var(--lime-tint); border-radius: var(--radius-chip); padding-left: 6pt; padding-right: 6pt; }
  .race--accent .race__date { color: var(--accent-deep); }

  table { width: 100%; border-collapse: collapse; font-size: 8.5pt; margin: 6pt 0 8pt 0; page-break-inside: avoid; }
  thead tr { background: var(--primary-deep); color: #fff; }
  th { padding: 5pt 7pt; text-align: left; font-weight: 700; font-family: var(--font-display); font-size: 8pt; }
  td { padding: 4.5pt 7pt; border-bottom: 0.5pt solid var(--hairline); }
  tbody tr:nth-child(even) { background: var(--tint); }
  tbody tr.hl td { background: var(--lime-tint); font-weight: 700; color: var(--accent-deep); }

  .chart-row { display: flex; gap: 10pt; margin: 4pt 0 8pt 0; page-break-inside: avoid; }
  .chart-row > div { flex: 1 1 50%; min-width: 0; }
  .chart-single { margin: 4pt auto 8pt auto; max-width: 400pt; page-break-inside: avoid; }

  .seal-row { margin-top: 18pt; text-align: center; }
  .seal-row img { height: 60pt; width: auto; transform: rotate(-6deg); }
  .seal-text { display: block; margin-top: 4pt; font-family: var(--font-display); font-weight: 700; font-size: 9pt; color: var(--primary-deep); }

  .page-break { page-break-before: always; }
</style>
</head>
<body>

<div class="page-runner">
  <table><tr>
    <td style="width: 50%;"><img src="static/img/logo.webp" alt=""></td>
    <td class="runner-title">Informe de mitad de temporada {{ season_year }}</td>
  </tr></table>
</div>

<div class="hero">
  <table><tr>
    <td style="width: 70pt;"><img src="static/img/logo.webp" alt="Club Deportivo Trocha y Ruta"></td>
    <td class="hero-text">
      <p class="eyebrow">Informe de mitad de temporada · {{ season_year }}</p>
      <h1>Tu temporada {{ season_year }},<br><span class="editorial-mark">válida tras válida</span></h1>
      <p class="hero-sub">{{ athlete_first_name }} · {{ category_label }} · Club Deportivo Trocha y Ruta · Generado el {{ generated_at }}</p>
    </td>
  </tr></table>
</div>

{{ body_html | safe }}

</body>
</html>
