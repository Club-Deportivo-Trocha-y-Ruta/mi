<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Cal+Sans&amp;display=swap">
  <style>
    body { margin: 0; font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #008492; }
    a:hover { color: #1a96a4; }
  </style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; background: #ffffff; overflow: hidden; color: #2f2f2f; font-family: 'Inter', system-ui, sans-serif;">

  <!-- Página de fondo (simplificada) -->
  <div style="display: flex; flex-direction: column; gap: 12px; width: 390px; height: 844px; padding: 72px 16px 16px 16px; box-sizing: border-box;">
    <div style="height: 44px; border-radius: 12px; background: #f5f5f5;"></div>
    <div style="height: 96px; border-radius: 16px; background: #f5f5f5;"></div>
    <div style="height: 128px; border-radius: 16px; background: #f5f5f5;"></div>
    <div style="height: 96px; border-radius: 16px; background: #f5f5f5;"></div>
    <div style="height: 128px; border-radius: 16px; background: #f5f5f5;"></div>
  </div>

  <!-- Velo -->
  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(17, 17, 17, 0.4);"></div>

  <!-- Menú lateral (drawer) — en ≥768 px esta misma barra queda fija -->
  <aside style="position: absolute; left: 0; top: 0; display: flex; flex-direction: column; width: 300px; height: 844px; background: #ffffff; border-radius: 0 16px 16px 0; box-shadow: rgba(19, 19, 22, 0.24) 8px 0px 24px -8px, rgba(34, 42, 53, 0.08) 1px 0px 0px 0px; padding: 16px; box-sizing: border-box;">

    <div style="display: flex; align-items: center; gap: 10px; padding: 4px;">
      <img src="logo-mark.png" alt="Trocha y Ruta" style="width: 32px; height: 32px; flex-shrink: 0;">
      <div style="display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1;">
        <span style="font-family: 'Cal Sans', 'Inter', system-ui, sans-serif; font-size: 15px; font-weight: 600; color: #2f2f2f; line-height: 1.2;">Trocha y Ruta</span>
        <span style="font-size: 11px; color: #717171;">Portal de familias</span>
      </div>
      <span style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; color: #717171;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></span>
    </div>

    <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #717171; padding: 16px 12px 6px 12px;">Tus deportistas</span>

    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 12px; border-radius: 12px; background: #e9f8fa;">
        <span style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 999px; background: #ffffff; color: #008492; font-size: 13px; font-weight: 600; flex-shrink: 0;">V</span>
        <div style="display: flex; flex-direction: column; gap: 0px; flex: 1; min-width: 0;">
          <span style="font-size: 14px; font-weight: 600; color: #2f2f2f;">Valeria</span>
          <span style="font-size: 11px; color: #717171;">12 años · Infantil</span>
        </div>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#008492" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M20 6 9 17l-5-5"></path></svg>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 12px; border-radius: 12px;">
        <span style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 999px; background: #f5f5f5; color: #5a5a5a; font-size: 13px; font-weight: 600; flex-shrink: 0;">S</span>
        <div style="display: flex; flex-direction: column; gap: 0px; flex: 1; min-width: 0;">
          <span style="font-size: 14px; font-weight: 500; color: #2f2f2f;">Samuel</span>
          <span style="font-size: 11px; color: #717171;">14 años · Prejuvenil</span>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 6px 12px; border-radius: 12px; color: #717171;">
        <span style="display: flex; align-items: center; justify-content: center; width: 32px; flex-shrink: 0;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></span>
        <span style="font-size: 13px; font-weight: 500;">Todos mis atletas</span>
      </div>
    </div>

    <div style="height: 1px; background: rgba(34, 42, 53, 0.08); margin: 12px 4px;"></div>

    <nav style="display: flex; flex-direction: column; gap: 2px;">
      <div style="position: relative; display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 10px 12px; border-radius: 12px; background: #e9f8fa;">
        <span style="position: absolute; left: 0; top: 13px; width: 3px; height: 18px; border-radius: 2px; background: #20b7c9;"></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#008492" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="M9 22V12h6v10"></path></svg>
        <span style="font-size: 14px; font-weight: 600; color: #2f2f2f;">Inicio</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 10px 12px; border-radius: 12px; color: #717171;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path></svg>
        <span style="font-size: 14px; font-weight: 500;">Calendario</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 10px 12px; border-radius: 12px; color: #717171;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><rect width="8" height="4" x="8" y="2" rx="1"></rect><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><path d="M12 11h4"></path><path d="M12 16h4"></path><path d="M8 11h.01"></path><path d="M8 16h.01"></path></svg>
        <span style="font-size: 14px; font-weight: 500;">Entrenamientos</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 10px 12px; border-radius: 12px; color: #717171;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M3 3v16a2 2 0 0 0 2 2h16"></path><path d="M18 17V9"></path><path d="M13 17V5"></path><path d="M8 17v-3"></path></svg>
        <span style="font-size: 14px; font-weight: 500;">Resumen mensual</span>
      </div>
    </nav>

    <div style="height: 1px; background: rgba(34, 42, 53, 0.08); margin: 12px 4px;"></div>

    <div style="display: flex; flex-direction: column; gap: 2px;">
      <div style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 10px 12px; border-radius: 12px; color: #717171;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg>
        <span style="font-size: 14px; font-weight: 500;">Mi perfil</span>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 10px 12px; border-radius: 12px; color: #717171;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path></svg>
        <span style="font-size: 14px; font-weight: 500;">Cerrar sesión</span>
      </div>
    </div>

    <div style="display: flex; margin-top: auto; padding: 12px 4px 0 4px; border-top: 1px solid rgba(34, 42, 53, 0.08);">
      <span style="display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; background: rgba(12, 163, 12, 0.1); border: 1px solid rgba(12, 163, 12, 0.3); padding: 3px 10px; font-size: 11px; font-weight: 500; color: #2f2f2f;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#0ca30c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="m9 12 2 2 4-4"></path></svg>Consentimientos al día</span>
    </div>
  </aside>
</div>
</x-dc>
</body>
</html>
