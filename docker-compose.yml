services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASS=${MYSQL_PASS}
      - MYSQL_DB=${MYSQL_DB}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173}
      - AI_ENABLED=${AI_ENABLED:-false}
      - AI_PROVIDER=${AI_PROVIDER:-fake}
      - AI_MODEL=${AI_MODEL:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_BASE_URL=${AI_BASE_URL:-}
      - AI_MAX_TOKENS=${AI_MAX_TOKENS:-1024}
      - AI_TIMEOUT_SECONDS=${AI_TIMEOUT_SECONDS:-30}
      - AI_TEMPERATURE=${AI_TEMPERATURE:-0.4}
      - AI_LOG_PROMPTS=${AI_LOG_PROMPTS:-false}
      # Race-results v2 — race/agents/ pipeline con proveedor propio
      - RACE_AI_PROVIDER=${RACE_AI_PROVIDER:-anthropic}
      - RACE_AI_MODEL=${RACE_AI_MODEL:-}
      - RACE_AI_API_KEY=${RACE_AI_API_KEY:-}
      # Strava Activity Sync (specs/025-strava-activity-sync)
      - STRAVA_ENABLED=${STRAVA_ENABLED:-false}
      - STRAVA_CLIENT_ID=${STRAVA_CLIENT_ID:-}
      - STRAVA_CLIENT_SECRET=${STRAVA_CLIENT_SECRET:-}
      - STRAVA_API_BASE_URL=${STRAVA_API_BASE_URL:-https://www.strava.com/api/v3}
      - STRAVA_OAUTH_BASE_URL=${STRAVA_OAUTH_BASE_URL:-https://www.strava.com/oauth}
      - STRAVA_REDIRECT_URI=${STRAVA_REDIRECT_URI:-http://localhost:8000/api/integrations/strava/callback}
      - STRAVA_TOKEN_ENCRYPTION_KEY=${STRAVA_TOKEN_ENCRYPTION_KEY:-}
      - STRAVA_WEBHOOK_VERIFY_TOKEN=${STRAVA_WEBHOOK_VERIFY_TOKEN:-}
      - STRAVA_RECONCILE_TOKEN=${STRAVA_RECONCILE_TOKEN:-}
      - STRAVA_SUBSCRIPTION_ID=${STRAVA_SUBSCRIPTION_ID:-}
      - STRAVA_RECONCILE_LOOKBACK_HOURS=${STRAVA_RECONCILE_LOOKBACK_HOURS:-48}
    networks: [backend]

  mailhog:
    # Servidor SMTP de desarrollo — captura emails sin enviarlos realmente
    # UI disponible en http://localhost:8025
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"   # Web UI
      # Puerto SMTP 1025 solo interno; el backend lo alcanza por nombre de servicio
    networks: [backend]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASS}
      MYSQL_DATABASE: ${MYSQL_DB}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASS}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [backend]

networks:
  backend:

volumes:
  mysql_data:
