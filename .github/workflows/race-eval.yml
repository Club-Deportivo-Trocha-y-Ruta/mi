name: Race Analyst Golden Eval

# Trigger: cualquier PR que toque agents, prompts o eval del race analyst.
# Eval bloqueante: promedio compuesto debe ser >= RACE_EVAL_THRESHOLD (0.75).
# Fuente: workflow §7.7, decisiones cerradas v2-implementation-workflow.md.

on:
  pull_request:
    paths:
      - "backend/app/services/race/agents/**"
      - "backend/app/services/race/prompts/**"
      - "backend/app/services/race/eval/**"
      - "backend/evals/race_analyst/golden/**"
      - "backend/tests/evals/**"
  workflow_dispatch:
    inputs:
      threshold:
        description: "Threshold mínimo composite_score (default 0.75)"
        required: false
        default: "0.75"

jobs:
  golden-eval:
    name: Run race analyst golden eval
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -e ".[dev]"
          # Deps adicionales necesarias para la stack race v2 (no en pyproject base).
          pip install langchain-google-genai chromadb jinja2

      - name: Run golden eval (bloqueante)
        env:
          # specs/036-ai-insights-tab-review (T051 — "The Gemini correction"):
          # el pipeline agéntico de race/agents/ lee su config vía
          # RACE_AI_PROVIDER/RACE_AI_MODEL/RACE_AI_API_KEY
          # (app/services/race/agents/_llm.py::build_chat_llm,
          # Settings.race_ai_* en config.py) — NO vía AI_PROVIDER/AI_MODEL/
          # AI_API_KEY, que pertenecen al stack independiente
          # app/services/ai/ (asistente de sesiones, informes, newsletters).
          # Antes de este fix el job exportaba las variables del OTRO stack:
          # como RACE_AI_PROVIDER quedaba sin definir, _llm.py caía al
          # default "anthropic" (config.py) sin ninguna API key resuelta
          # (el fallback a AI_API_KEY sólo aplica si ambos proveedores
          # coinciden) — el guard de abajo nunca lo habría detectado
          # porque miraba RACE_AI_API_KEY/GOOGLE_API_KEY, no AI_API_KEY.
          # Alineado con backend/.env real y con producción: Google
          # Gemini Flash Lite, NO Anthropic (el club se queda en el free
          # tier de Gemini — ver IMPLEMENTATION_STATE.md, decisión D1).
          RACE_AI_API_KEY: ${{ secrets.RACE_AI_API_KEY }}
          RACE_AI_PROVIDER: google
          RACE_AI_MODEL: gemini-3.1-flash-lite
          # Timeout/tokens/temperatura NO tienen equivalente RACE_AI_* propio
          # — build_chat_llm cae a estos mismos Settings.ai_* para todos los
          # proveedores (ver _llm.py), así que sí aplican aquí.
          AI_TEMPERATURE: "0.4"
          AI_MAX_TOKENS: "8192"
          AI_TIMEOUT_SECONDS: "30"
          AI_LOG_PROMPTS: "false"
          RACE_EVAL_THRESHOLD: ${{ github.event.inputs.threshold || '0.75' }}
        run: |
          if [ -z "$RACE_AI_API_KEY" ]; then
            echo "::error::RACE_AI_API_KEY no configurado en secrets de GitHub."
            exit 1
          fi
          pytest tests/evals/test_race_analyst_eval.py -m golden -v --tb=short

      - name: Upload scoreboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: race-eval-scoreboard-${{ github.run_id }}
          path: backend/evals/race_analyst/results/last_run.md
          if-no-files-found: warn
          retention-days: 30
